name: ASGI Server Benchmarks

on:
  push:

jobs:
  benchmark-asgi-servers:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install benchmark dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn granian uvloop httptools
          go install github.com/rakyll/hey@v0.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Benchmark FastAPI and vanilla ASGI servers
        run: |
          set -euo pipefail

          APP_DIR=/tmp/asgi-bench
          RESULTS_FILE="$GITHUB_WORKSPACE/benchmarks/asgi_server_benchmarks.md"
          mkdir -p "$APP_DIR" "$GITHUB_WORKSPACE/benchmarks"

          cat <<'PY' > "$APP_DIR/fastapi_app.py"
          from fastapi import FastAPI

          app = FastAPI()


          @app.get("/")
          async def root():
              return {"message": "ok"}
          PY

          cat <<'PY' > "$APP_DIR/vanilla_app.py"
          import json


          async def app(scope, receive, send):
              if scope["type"] != "http":
                  return

              body = json.dumps({"message": "ok"}).encode("utf-8")
              await send(
                  {
                      "type": "http.response.start",
                      "status": 200,
                      "headers": [(b"content-type", b"application/json")],
                  }
              )
              await send({"type": "http.response.body", "body": body})
          PY

          {
            echo "# ASGI Server Benchmark Results"
            echo
            echo "- Requests per benchmark: 100,000"
            echo "- Client concurrency: 4"
            echo
            echo "| Server configuration | Throughput (req/s) | Min duration (ms) | Max duration (ms) | Mean duration (ms) | Median duration (ms) |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: |"
          } > "$RESULTS_FILE"

          REQUESTS=100000
          CONCURRENCY=4
          CPU_COUNT="$(getconf _NPROCESSORS_ONLN || echo 1)"
          if [ "$CPU_COUNT" -lt 1 ]; then
            CPU_COUNT=1
          fi
          if [ "$CPU_COUNT" -gt 4 ]; then
            SERVER_WORKERS=4
          else
            SERVER_WORKERS="$CPU_COUNT"
          fi
          STARTUP_WAIT_SECONDS=60
          REQUEST_TIMEOUT_SECONDS=30
          WARMUP_REQUESTS=200

          secs_to_ms() {
            local seconds="$1"
            awk -v s="$seconds" 'BEGIN { printf "%.4f", s * 1000 }'
          }

          cleanup_server() {
            local server_pid="${1:-}"
            local log_file="${2:-}"
            local child_pids=""

            if [ -n "${server_pid:-}" ] && [ "$server_pid" -gt 0 ] 2>/dev/null; then
              child_pids="$(ps -o pid= --ppid "$server_pid" 2>/dev/null || true)"
              kill "$server_pid" >/dev/null 2>&1 || true
              wait "$server_pid" >/dev/null 2>&1 || true
            fi
            for pid in $child_pids; do
              kill "$pid" >/dev/null 2>&1 || true
            done
            if [ -n "${log_file:-}" ]; then
              rm -f "$log_file"
            fi
            python -c "import gc; gc.collect()"
          }

          run_benchmark() {
            local label="$1"
            local server_cmd="$2"
            local port="$3"
            local log_file="/tmp/asgi-bench-${port}.log"
            local hey_log_file="/tmp/asgi-bench-hey-${port}.log"

            (cd "$APP_DIR" && bash -c "$server_cmd") > "$log_file" 2>&1 &
            local server_pid=$!

            for _ in $(seq 1 "$STARTUP_WAIT_SECONDS"); do
              if curl -fsS "http://127.0.0.1:${port}/" >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done

            if ! curl -fsS "http://127.0.0.1:${port}/" >/dev/null 2>&1; then
              echo "Server failed to start for ${label}" >&2
              cat "$log_file" >&2
              echo "| ${label} | n/a | n/a | n/a | n/a | n/a |" >> "$RESULTS_FILE"
              cleanup_server "$server_pid" "$log_file"
              rm -f "$hey_log_file"
              return 1
            fi

            # Warm-up run so worker processes/threads and connection pools are initialized before measuring.
            hey -n "$WARMUP_REQUESTS" -c "$CONCURRENCY" -t "$REQUEST_TIMEOUT_SECONDS" "http://127.0.0.1:${port}/" >/dev/null 2>&1 || true

            if ! hey -n "$REQUESTS" -c "$CONCURRENCY" -t "$REQUEST_TIMEOUT_SECONDS" "http://127.0.0.1:${port}/" > "$hey_log_file"; then
              echo "| ${label} | n/a | n/a | n/a | n/a | n/a |" >> "$RESULTS_FILE"
              cleanup_server "$server_pid" "$log_file"
              rm -f "$hey_log_file"
              return 1
            fi

            cleanup_server "$server_pid" "$log_file"

            local throughput fastest_s slowest_s avg_s median_s min_ms max_ms mean_ms median_ms
            throughput="$(sed -nE 's/^[[:space:]]*Requests\/sec:[[:space:]]*([0-9.]+).*/\1/p' "$hey_log_file" | tail -n1)"
            fastest_s="$(sed -nE 's/^[[:space:]]*Fastest:[[:space:]]*([0-9.]+)[[:space:]]*secs/\1/p' "$hey_log_file" | tail -n1)"
            slowest_s="$(sed -nE 's/^[[:space:]]*Slowest:[[:space:]]*([0-9.]+)[[:space:]]*secs/\1/p' "$hey_log_file" | tail -n1)"
            avg_s="$(sed -nE 's/^[[:space:]]*Average:[[:space:]]*([0-9.]+)[[:space:]]*secs/\1/p' "$hey_log_file" | tail -n1)"
            median_s="$(awk '/^[[:space:]]*50%/ {v=$(NF-1)} END {print v}' "$hey_log_file")"

            if [ -z "${throughput:-}" ] || [ -z "${fastest_s:-}" ] || [ -z "${slowest_s:-}" ] || [ -z "${avg_s:-}" ] || [ -z "${median_s:-}" ]; then
              echo "| ${label} | n/a | n/a | n/a | n/a | n/a |" >> "$RESULTS_FILE"
              rm -f "$hey_log_file"
              return 1
            fi
            local number_re='^[0-9]+([.][0-9]+)?$'
            for metric in "$throughput" "$fastest_s" "$slowest_s" "$avg_s" "$median_s"; do
              if ! [[ "$metric" =~ $number_re ]]; then
                echo "| ${label} | n/a | n/a | n/a | n/a | n/a |" >> "$RESULTS_FILE"
                rm -f "$hey_log_file"
                return 1
              fi
            done

            min_ms="$(secs_to_ms "$fastest_s")"
            max_ms="$(secs_to_ms "$slowest_s")"
            mean_ms="$(secs_to_ms "$avg_s")"
            median_ms="$(secs_to_ms "$median_s")"
            echo "| ${label} | ${throughput} | ${min_ms} | ${max_ms} | ${mean_ms} | ${median_ms} |" >> "$RESULTS_FILE"
            rm -f "$hey_log_file"
          }

          benchmark_failed=0

          run_benchmark "FastAPI on uvicorn" "python -m uvicorn fastapi_app:app --host 127.0.0.1 --port 8000 --workers $SERVER_WORKERS --loop uvloop --http httptools --no-access-log --lifespan off" 8000 || benchmark_failed=1
          # In Granian mt mode, a single worker with runtime threads avoids worker*thread oversubscription on CI runners.
          run_benchmark "FastAPI on granian" "granian --interface asgi --host 127.0.0.1 --port 8001 --workers 1 --runtime-mode mt --runtime-threads $SERVER_WORKERS --loop uvloop fastapi_app:app" 8001 || benchmark_failed=1
          run_benchmark "Vanilla ASGI uvicorn" "python -m uvicorn vanilla_app:app --host 127.0.0.1 --port 8002 --workers $SERVER_WORKERS --loop uvloop --http httptools --no-access-log --lifespan off" 8002 || benchmark_failed=1
          run_benchmark "Vanilla ASGI granian" "granian --interface asgi --host 127.0.0.1 --port 8003 --workers 1 --runtime-mode mt --runtime-threads $SERVER_WORKERS --loop uvloop vanilla_app:app" 8003 || benchmark_failed=1

          cat "$RESULTS_FILE" >> "$GITHUB_STEP_SUMMARY"
          exit "$benchmark_failed"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asgi-server-benchmarks
          path: benchmarks/asgi_server_benchmarks.md
