name: Task Queue Benchmarks

on:
  push:
    paths:
      - "benchmarks/run_task_queue_benchmarks.py"
      - ".github/workflows/task-queue-benchmarks.yml"
  workflow_dispatch:
    inputs:
      queues:
        description: "Space-separated queue IDs to benchmark (empty = all)"
        required: false
        default: ""
        type: string
      scenarios:
        description: "Space-separated scenario names to run (empty = all)"
        required: false
        default: ""
        type: string

# Cancel previous runs on re-push / re-dispatch
concurrency:
  group: task-queue-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: bench
        options: >-
          --health-cmd "pg_isready -U bench"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go (for hey HTTP load tool)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpq-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # Server stack — same gunicorn+uvicorn setup as extended-server-benchmarks
          pip install \
            uvicorn[standard] gunicorn uvicorn-worker \
            fastapi pydantic
          # Distributed task queues
          pip install \
            "celery[redis]" \
            rq \
            bullmq \
            huey \
            "dramatiq[redis]" \
            arq \
            tasktiger \
            "taskiq[redis]" taskiq-redis \
            "procrastinate[aiopg]" \
            apscheduler \
            rocketry \
            faust-streaming \
            redis \
            psycopg2-binary \
            aiopg \
            aiokafka

      - name: Install hey
        run: |
          go install github.com/rakyll/hey@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Apply Procrastinate schema
        run: |
          python - << 'EOF'
          import asyncio, procrastinate

          async def _apply():
              connector = procrastinate.AiopgConnector()
              app = procrastinate.App(connector=connector)
              async with app.open_async(dsn="postgresql://bench:bench@localhost:5432/bench"):
                  await app.schema_manager.apply_schema_async()

          asyncio.run(_apply())
          EOF

      - name: Create Kafka benchmark topic
        run: |
          KAFKA_CONTAINER=$(docker ps -qf "name=kafka" | head -1)
          if [ -n "$KAFKA_CONTAINER" ]; then
            docker exec "$KAFKA_CONTAINER" \
              kafka-topics.sh \
                --bootstrap-server localhost:9092 \
                --create --if-not-exists \
                --topic bench-tasks \
                --partitions 1 \
                --replication-factor 1 || true
          else
            echo "Kafka container not found; topic creation skipped"
          fi

      - name: Verify tools and services
        run: |
          python --version
          redis-cli -h 127.0.0.1 ping
          psql "postgresql://bench:bench@localhost:5432/bench" -c "SELECT 1" -q
          pip show gunicorn | grep Version
          uvicorn --version
          python -c "import celery; print('celery', celery.__version__)"
          python -c "import rq; print('rq', rq.__version__)"
          python -c "import bullmq; print('bullmq', bullmq.__version__)" || true
          python -c "import huey; print('huey', huey.__version__)"
          python -c "import dramatiq; print('dramatiq', dramatiq.__version__)"
          python -c "import arq; print('arq', arq.__version__)"
          python -c "import tasktiger; print('tasktiger OK')"
          python -c "import taskiq; print('taskiq', taskiq.__version__)" || true
          python -c "import procrastinate; print('procrastinate', procrastinate.__version__)"
          python -c "import apscheduler; print('apscheduler', apscheduler.__version__)" || true
          python -c "import rocketry; print('rocketry OK')" || true
          python -c "import faust; print('faust', faust.__version__)" || true

      - name: Run task queue benchmarks
        env:
          BENCH_QUEUES: ${{ inputs.queues }}
          BENCH_SCENARIOS: ${{ inputs.scenarios }}
          PROCRASTINATE_URL: "postgresql://bench:bench@localhost:5432/bench"
        run: |
          QUEUES_ARG=""
          if [ -n "$BENCH_QUEUES" ]; then
            QUEUES_ARG="--queues $BENCH_QUEUES"
          fi
          SCENARIOS_ARG=""
          if [ -n "$BENCH_SCENARIOS" ]; then
            SCENARIOS_ARG="--scenarios $BENCH_SCENARIOS"
          fi
          python benchmarks/run_task_queue_benchmarks.py \
            $QUEUES_ARG \
            $SCENARIOS_ARG

      - name: Post summary
        if: always()
        run: |
          if [ -f benchmarks/results/task_queue_summary.md ]; then
            cat benchmarks/results/task_queue_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-queue-benchmark-results
          path: benchmarks/results/task_queue*
          retention-days: 90
